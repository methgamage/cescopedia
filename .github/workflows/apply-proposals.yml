# Runs ONLY after a change has been merged into main (push), never on a pull request, so a proposal cannot run any code.
# Merging a proposal pull request = approval. This workflow then archives the old version, writes the change-log entry,
# rebuilds the site and publishes the result to main (via a bot pull request, see below).
name: Apply approved proposals
on:
  push:
    branches: [main]
    paths: ['proposals/**']        # only when a merge actually brings a proposal in

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: apply-proposals
  cancel-in-progress: false

jobs:
  apply:
    # loop guard 1: never react to our own commits (GITHUB_TOKEN pushes also do not trigger workflows; guard 2 is the paths filter: the bot commit only removes proposals/<id>/, and an empty proposals/ makes the script a no-op)
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow
      - name: Who merged it?
        id: who
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.merged_at != null)][0].number // empty')
          if [ -n "$pr" ]; then
            gh api "repos/$REPO/pulls/$pr" > pr.json
            approver=$(jq -r '.merged_by.login' pr.json)
            echo "pr=$pr" >> "$GITHUB_OUTPUT"
            echo "pr_url=$(jq -r .html_url pr.json)" >> "$GITHUB_OUTPUT"
            echo "pr_author=$(jq -r .user.login pr.json)" >> "$GITHUB_OUTPUT"
            echo "branch=$(jq -r .head.ref pr.json)" >> "$GITHUB_OUTPUT"
            echo "grok=$(jq -r '[.labels[].name] | index("grok") != null' pr.json)" >> "$GITHUB_OUTPUT"
            # a proposal PR may only touch proposals/ ; anything else is a code change and is not auto-applied
            outside=$(gh api "repos/$REPO/pulls/$pr/files" --paginate --jq '.[].filename' | grep -v '^proposals/' || true)
            echo "outside=$([ -n "$outside" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          else
            approver="$ACTOR"          # direct push by an admin (no PR): the pusher is the approver
            echo "outside=no" >> "$GITHUB_OUTPUT"
          fi
          echo "approver=$approver" >> "$GITHUB_OUTPUT"
          echo "Approver (merger): $approver, PR: ${pr:-none}"
      - name: Refuse mixed PRs
        if: steps.who.outputs.outside == 'yes'
        run: |
          echo "::error::This pull request changes files outside proposals/. Proposals are not applied automatically from such a PR."
          exit 1
      - name: Apply proposals, archive, change log, rebuild
        id: apply
        env:
          APPROVER: ${{ steps.who.outputs.approver }}
          PR: ${{ steps.who.outputs.pr }}
          PR_URL: ${{ steps.who.outputs.pr_url }}
          PR_AUTHOR: ${{ steps.who.outputs.pr_author }}
          BRANCH: ${{ steps.who.outputs.branch }}
          GROK: ${{ steps.who.outputs.grok }}
        run: |
          args=(--approver "$APPROVER" --result-file "$RUNNER_TEMP/result.json")
          [ -n "$PR" ] && args+=(--pr "$PR" --pr-url "$PR_URL" --pr-author "$PR_AUTHOR" --branch "$BRANCH")
          [ "$GROK" = "true" ] && args+=(--grok)
          set +e
          python3 tools/apply_proposals.py "${args[@]}" | tee "$RUNNER_TEMP/apply.log"
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish through a bot pull request (GITHUB_TOKEN)
        # main is protected by a ruleset (pull request required, no force push, no deletion, NO bypass actors). GitHub does not let
        # GITHUB_TOKEN bypass such a rule on a personal repository, so the generated result goes in like any other change:
        # a short-lived publish/* branch, a pull request, merged by the workflow itself.
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVER: ${{ steps.who.outputs.approver }}
          PR: ${{ steps.who.outputs.pr }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          what=$(grep -h '^APPLIED' "$RUNNER_TEMP/apply.log" | sed 's/^APPLIED //; s/ (.*//' | paste -sd, - || true)
          [ -n "$what" ] || what="proposal(s) that could not be applied (see PR comment)"
          branch="publish/${PR:-direct}-$(date -u +%Y%m%d-%H%M%S)"
          msg="Publish: ${what} — approved by ${APPROVER} (PR #${PR:-none}) [skip ci]"
          git checkout -q -b "$branch"
          git commit -q -m "$msg"
          git push -q origin "$branch"
          url=$(gh pr create --base main --head "$branch" --title "$msg" \
                --body "Automatic publish of an approved proposal (approver: ${APPROVER}, source PR: #${PR:-none}). Archive, change log and regenerated pages. Created and merged by the workflow.")
          for i in 1 2 3 4 5; do
            if gh pr merge "$url" --squash --delete-branch; then break; fi
            sleep $((i*5)); [ "$i" = 5 ] && { echo "::error::could not merge the publish PR $url"; exit 1; }
          done
      - name: Comment on the pull request
        if: steps.who.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.who.outputs.pr }}
        run: |
          {
            echo "### Approval processed"
            echo
            echo '```'
            cat "$RUNNER_TEMP/apply.log"
            echo '```'
          } > comment.md
          gh pr comment "$PR" --body-file comment.md
          cp comment.md "$GITHUB_STEP_SUMMARY"
      - name: Fail the run if a proposal could not be applied
        if: steps.apply.outputs.rc != '0'
        run: |
          echo "::error::A proposal could not be applied (see log). It was moved to proposals/_conflict/."
          exit 1
